name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows-android:
    name: Windows + KernelSU
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@12.3.4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
      - name: Rust tooling
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
      - name: Verify release version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $cargo = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $module = [regex]::Match((Get-Content module/module.prop -Raw), '(?m)^version=([^\r\n]+)').Groups[1].Value
          $web = (Get-Content webui/package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $cargo -or $version -ne $module -or $version -ne $web) {
            throw "Tag/version mismatch: tag=$version cargo=$cargo module=$module webui=$web"
          }
      - name: Build release
        shell: pwsh
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          .\scripts\release.ps1
          $version = "${{ github.ref_name }}".TrimStart('v')
          Copy-Item dist\sidewire.exe "dist\sidewire-v$version-windows-x86_64.exe"
      - uses: actions/upload-artifact@v6
        with:
          name: release-windows-android
          if-no-files-found: error
          path: |
            dist/sidewire-v*-windows-x86_64.exe
            dist/SideWire-KernelSU-v*-arm64.zip

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
      - name: Verify release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          test "$version" = "$cargo_version" || { echo "tag/version mismatch"; exit 1; }
      - name: Build release
        run: bash ./scripts/release-linux.sh
      - uses: actions/upload-artifact@v6
        with:
          name: release-linux
          if-no-files-found: error
          path: dist/sidewire-v*-linux-x86_64

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
      - name: Verify release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          test "$version" = "$cargo_version" || { echo "tag/version mismatch"; exit 1; }
      - name: Build release
        run: bash ./scripts/release-macos.sh
      - uses: actions/upload-artifact@v6
        with:
          name: release-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/sidewire-v*-macos-${{ matrix.arch }}

  publish:
    name: Publish GitHub Release
    needs: [windows-android, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: SideWire ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          fail_on_unmatched_files: true
          files: |
            dist/sidewire-v*-windows-x86_64.exe
            dist/sidewire-v*-linux-x86_64
            dist/sidewire-v*-macos-arm64
            dist/sidewire-v*-macos-x86_64
            dist/SideWire-KernelSU-v*-arm64.zip
            dist/SHA256SUMS
